<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-ie8lmask17CVkNFkXcVpAjQnxZV7npVxuIK2zUy7jU1Au8GNh5+ayG4yFWiUB2ExM+Z7de+wa8fIp6LUFs2gH7Z6N4g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Supabase JS CDN from jsdelivr -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl shadow-purple-100/50 p-6 sm:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-purple-600"><i class="fa-solid fa-user-tag mr-2 text-purple-500"></i>Registro de Personas</h1>
            <p class="text-gray-600 mt-2">Gestión sencilla de registros personales</p>
        </header>

        <!-- Formulario de Registro -->
        <form id="registroForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                        <i class="fa-solid fa-user text-purple-500 mr-2"></i> Nombre
                    </label>
                    <input type="text" id="nombre" name="nombre" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                        placeholder="Ingrese el nombre">
                </div>
                <div>
                    <label for="apellido" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                        <i class="fa-solid fa-user text-purple-500 mr-2"></i> Apellido
                    </label>
                    <input type="text" id="apellido" name="apellido" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                        placeholder="Ingrese el apellido">
                </div>
            </div>
            <div>
                <label for="cedula" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fa-solid fa-id-card text-purple-500 mr-2"></i> Cédula
                </label>
                <input type="text" id="cedula" name="cedula" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                    placeholder="Ingrese la cédula"
                    maxlength="20">
            </div>
            <div>
                <label for="edad" class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <i class="fa-solid fa-calendar-days text-purple-500 mr-2"></i> Edad
                </label>
                <input type="number" id="edad" name="edad" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                    placeholder="Ingrese la edad"
                    min="0" max="150">
            </div>
            <div class="flex justify-end">
                <button type="submit" id="submitBtn"
                    class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-xl shadow-lg shadow-purple-200 transition-all duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus mr-2"></i> Guardar Registro
                </button>
            </div>
        </form>

        <!-- Tabla de Registros -->
        <section class="mt-8">
            <h2 class="text-2xl font-bold text-purple-600 mb-4"><i class="fa-solid fa-table mr-2 text-purple-500"></i>Registros</h2>
            <div class="overflow-x-auto">
                <table id="registrosTable" class="w-full border-collapse">
                    <thead>
                        <tr class="bg-purple-50">
                            <th class="px-4 py-2 text-left text-xs font-medium text-purple-600 uppercase tracking-wider">
                                <i class="fa-solid fa-id-card text-purple-500 mr-1"></i> Cédula
                            </th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-purple-600 uppercase tracking-wider">
                                <i class="fa-solid fa-user text-purple-500 mr-1"></i> Nombre
                            </th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-purple-600 uppercase tracking-wider">
                                <i class="fa-solid fa-user text-purple-500 mr-1"></i> Apellido
                            </th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-purple-600 uppercase tracking-wider">
                                <i class="fa-solid fa-calendar-days text-purple-500 mr-1"></i> Edad
                            </th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-purple-600 uppercase tracking-wider">
                                <i class="fa-solid fa-cogs text-purple-500 mr-1"></i> Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Las filas se generarán dinámicamente -->
                    </tbody>
                </table>
            </div>
            <p id="emptyState" class="text-center text-gray-500 mt-4 flex items-center justify-center gap-2">
                <i class="fa-solid fa-inbox"></i> No hay registros aún. ¡Agrega el primero!
            </p>
        </section>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
